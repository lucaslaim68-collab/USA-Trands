<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Advance Blog & Auto-Commit to GitHub - Food Trends USA</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 text-gray-900 font-sans">

    <!-- Navbar -->
    <header class="bg-white shadow-sm sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-6 py-4 flex justify-between items-center">
            <a href="index.html" class="text-2xl font-black text-red-600 tracking-wider">Food Trends USA</a>
            <a href="index.html" class="text-sm font-semibold text-gray-600 hover:text-red-600">&larr; Back to Home</a>
        </div>
    </header>

    <!-- Form Container -->
    <main class="max-w-3xl mx-auto px-6 py-12">
        <div class="bg-white rounded-3xl shadow-xl p-8 md:p-12 border border-gray-100">
            <h1 class="text-3xl font-black mb-8 text-gray-800 border-b pb-4">Publish & Sync to GitHub</h1>
            
            <form id="advanceBlogForm" onsubmit="handleGitHubPublish(event)" class="space-y-6">
                
                <!-- GitHub Credentials Box -->
                <div class="bg-gray-50 p-6 rounded-2xl border border-gray-200 space-y-4">
                    <h2 class="text-md font-bold text-gray-700">GitHub Settings (For Direct Auto-Commit)</h2>
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <div>
                            <label class="block text-xs font-bold mb-1 text-gray-600">GitHub Username</label>
                            <input type="text" id="ghUser" required class="w-full border rounded-lg px-3 py-2 text-sm bg-white" placeholder="e.g. your-username">
                        </div>
                        <div>
                            <label class="block text-xs font-bold mb-1 text-gray-600">Repository Name</label>
                            <input type="text" id="ghRepo" required class="w-full border rounded-lg px-3 py-2 text-sm bg-white" placeholder="e.g. foodtrend-blog">
                        </div>
                    </div>
                    <div>
                        <label class="block text-xs font-bold mb-1 text-gray-600">GitHub Personal Access Token (PAT)</label>
                        <input type="password" id="ghToken" required class="w-full border rounded-lg px-3 py-2 text-sm bg-white" placeholder="ghp_xxxxxxxxxxxxxxxxxxxx">
                        <p class="text-[11px] text-gray-500 mt-1">Token ko GitHub Settings > Developer Settings > Personal Access Tokens (repo scope ke sath) se banayein.</p>
                    </div>
                </div>

                <!-- Blog Title -->
                <div>
                    <label class="block text-sm font-bold mb-2 text-gray-700">Blog Title</label>
                    <input type="text" id="blogTitle" required class="w-full border border-gray-300 rounded-xl px-4 py-3 focus:ring-2 focus:ring-red-500 focus:outline-none" placeholder="e.g. Best Seafood Restaurants in Miami">
                </div>

                <!-- Meta Title -->
                <div>
                    <label class="block text-sm font-bold mb-2 text-gray-700">SEO Meta Title</label>
                    <input type="text" id="metaTitle" required class="w-full border border-gray-300 rounded-xl px-4 py-3 focus:ring-2 focus:ring-red-500 focus:outline-none" placeholder="SEO optimized title">
                </div>

                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <div>
                        <label class="block text-sm font-bold mb-2 text-gray-700">Category</label>
                        <select id="blogCategory" class="w-full border border-gray-300 rounded-xl px-4 py-3 bg-white focus:outline-none">
                            <option value="Restaurants & Cafes">Restaurants & Cafes</option>
                            <option value="Fast Food & Pizza">Fast Food & Pizza</option>
                            <option value="Healthy & Organic">Healthy & Organic</option>
                            <option value="Recipes & Baking">Recipes & Baking</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-sm font-bold mb-2 text-gray-700">Author Name</label>
                        <input type="text" id="blogAuthor" required class="w-full border border-gray-300 rounded-xl px-4 py-3 focus:outline-none" placeholder="Lucas Laim">
                    </div>
                </div>

                <!-- Featured Image Upload -->
                <div>
                    <label class="block text-sm font-bold mb-2 text-gray-700">Featured Image</label>
                    <input type="file" id="imageFile" accept="image/*" required class="w-full border border-gray-300 rounded-xl px-4 py-2.5 bg-gray-50">
                </div>

                <!-- Short Description -->
                <div>
                    <label class="block text-sm font-bold mb-2 text-gray-700">Short Summary</label>
                    <textarea id="shortDesc" rows="3" required class="w-full border border-gray-300 rounded-xl px-4 py-3 focus:outline-none" placeholder="Brief overview..."></textarea>
                </div>

                <!-- Rich Text Editor -->
                <div>
                    <label class="block text-sm font-bold mb-2 text-gray-700">Long Description & Content Editor</label>
                    <div class="flex flex-wrap gap-1.5 bg-gray-100 p-2 border border-gray-300 border-b-0 rounded-t-xl">
                        <button type="button" onclick="formatDoc('h1')" class="px-3 py-1 bg-white border rounded font-bold text-xs">H1</button>
                        <button type="button" onclick="formatDoc('h2')" class="px-3 py-1 bg-white border rounded font-bold text-xs">H2</button>
                        <button type="button" onclick="formatDoc('bold')" class="px-3 py-1 bg-white border rounded font-bold text-xs">B</button>
                        <button type="button" onclick="formatDoc('italic')" class="px-3 py-1 bg-white border rounded italic text-xs">I</button>
                        <button type="button" onclick="insertAnchorLink()" class="px-3 py-1 bg-white border rounded text-xs">🔗 Anchor Link</button>
                        <button type="button" onclick="formatDoc('insertUnorderedList')" class="px-3 py-1 bg-white border rounded text-xs">• List</button>
                    </div>
                    <div id="editorContent" contenteditable="true" class="w-full border border-gray-300 rounded-b-xl px-4 py-4 min-h-[200px] bg-white focus:outline-none"></div>
                </div>

                <button type="submit" id="submitBtn" class="w-full bg-red-600 text-white font-extrabold py-4 rounded-xl hover:bg-red-700 transition shadow-lg text-lg">
                    Publish & Push to GitHub 🚀
                </button>
            </form>
        </div>
    </main>

    <footer class="bg-gray-900 text-white py-10 text-center mt-20">
        <p class="text-sm text-gray-400">&copy; 2026 Food Trends USA (foodtrend.blog). All rights reserved.</p>
    </footer>

    <script>
        function formatDoc(cmd) {
            if (cmd === 'bold') document.execCommand('bold', false, null);
            else if (cmd === 'italic') document.execCommand('italic', false, null);
            else if (cmd === 'h1') document.execCommand('formatBlock', false, '<h1>');
            else if (cmd === 'h2') document.execCommand('formatBlock', false, '<h2>');
            else if (cmd === 'insertUnorderedList') document.execCommand('insertUnorderedList', false, null);
        }

        function insertAnchorLink() {
            const url = prompt("Enter target URL link:");
            if (url) document.execCommand('createLink', false, url);
        }

        function createSlug(title) {
            return title.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/(^-|-$)+/g, '');
        }

        async function handleGitHubPublish(e) {
            e.preventDefault();
            const btn = document.getElementById('submitBtn');
            btn.innerText = "Pushing to GitHub...";
            btn.disabled = true;

            const username = document.getElementById('ghUser').value.trim();
            const repo = document.getElementById('ghRepo').value.trim();
            const token = document.getElementById('ghToken').value.trim();

            const title = document.getElementById('blogTitle').value;
            const metaTitle = document.getElementById('metaTitle').value;
            const category = document.getElementById('blogCategory').value;
            const author = document.getElementById('blogAuthor').value;
            const shortDesc = document.getElementById('shortDesc').value;
            const longDesc = document.getElementById('editorContent').innerHTML;
            const fileInput = document.getElementById('imageFile');

            if (fileInput.files && fileInput.files[0]) {
                const reader = new FileReader();
                reader.onload = async function(uploadEvent) {
                    const imageUrl = uploadEvent.target.result;
                    const slug = createSlug(title) + '-' + Date.now();

                    const newPost = {
                        slug,
                        title,
                        metaTitle,
                        category,
                        author,
                        date: new Date().toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' }),
                        imageUrl,
                        shortDesc,
                        longDesc
                    };

                    // Local storage mein bhi save karein taake turant show ho
                    const stored = localStorage.getItem('foodtrend_posts');
                    const posts = stored ? JSON.parse(stored) : [];
                    posts.unshift(newPost);
                    localStorage.setItem('foodtrend_posts', JSON.stringify(posts));

                    // GitHub API ke zariye repository mein JSON file update karna
                    try {
                        const filePath = `posts.json`;
                        const apiUrl = `https://api.github.com/repos/${username}/${repo}/contents/${filePath}`;

                        // Pehle check karein agar posts.json pehle se maujood hai toh uska sha lena hoga
                        let sha = null;
                        const getRes = await fetch(apiUrl, {
                            headers: { 'Authorization': `token ${token}` }
                        });
                        if (getRes.ok) {
                            const fileData = await getRes.json();
                            sha = fileData.sha;
                        }

                        // Updated posts array ko GitHub par commit karein
                        const contentEncoded = btoa(unescape(encodeURIComponent(JSON.stringify(posts, null, 2))));
                        const bodyData = {
                            message: `Add new blog post: ${title}`,
                            content: contentEncoded,
                            sha: sha
                        };

                        const putRes = await fetch(apiUrl, {
                            method: 'PUT',
                            headers: {
                                'Authorization': `token ${token}`,
                                'Content-Type': 'application/json'
                            },
                            body: JSON.stringify(bodyData)
                        });

                        if (putRes.ok) {
                            alert('Post successfully committed and pushed to GitHub repository!');
                            window.location.href = `post.html?slug=${slug}`;
                        } else {
                            const errJson = await putRes.json();
                            alert('GitHub Error: ' + errJson.message);
                            btn.innerText = "Publish & Push to GitHub 🚀";
                            btn.disabled = false;
                        }

                    } catch (err) {
                        console.error(err);
                        alert('Network error while pushing to GitHub.');
                        btn.innerText = "Publish & Push to GitHub 🚀";
                        btn.disabled = false;
                    }
                }
                reader.readAsDataURL(fileInput.files[0]);
            }
        }
    </script>
</body>
</html>
