<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="pageTitle">Post Detail - Food Trends USA</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 text-gray-900 font-sans">

    <!-- Navbar -->
    <header class="bg-white shadow-sm sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-6 py-4 flex justify-between items-center">
            <a href="index.html" class="text-2xl font-black text-red-600 tracking-wider">Food Trends USA</a>
            <a href="index.html" class="text-sm font-semibold text-gray-600 hover:text-red-600">&larr; Back to Home</a>
        </div>
    </header>

    <!-- Main Content Container -->
    <main class="max-w-4xl mx-auto px-6 py-12">
        <div id="postContainer" class="bg-white rounded-3xl shadow-lg p-8 md:p-12 border border-gray-100">
            <!-- Content injected dynamically -->
        </div>
    </main>

    <!-- Footer -->
    <footer class="bg-gray-900 text-white py-10 text-center mt-20">
        <p class="text-sm text-gray-400">&copy; 2026 Food Trends USA (foodtrend.blog). All rights reserved.</p>
    </footer>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const slug = urlParams.get('slug');

        const stored = localStorage.getItem('foodtrend_posts');
        const posts = stored ? JSON.parse(stored) : [];
        const post = posts.find(p => p.slug === slug);

        const container = document.getElementById('postContainer');

        if (post) {
            document.getElementById('pageTitle').innerText = `${post.metaTitle || post.title}`;
            container.innerHTML = `
                <div class="mb-6 flex flex-wrap items-center gap-3">
                    <span class="bg-red-100 text-red-600 text-xs font-bold px-3 py-1 rounded-full uppercase">${post.category || 'General'}</span>
                    <span class="text-gray-400 text-sm">•</span>
                    <span class="text-gray-500 text-sm">By <b>${post.author || 'Admin'}</b></span>
                    <span class="text-gray-400 text-sm">•</span>
                    <span class="text-gray-500 text-sm">${post.date || 'Today'}</span>
                </div>

                <h1 class="text-3xl md:text-5xl font-black text-gray-900 mb-6 leading-tight">${post.title}</h1>
                <p class="text-xl text-gray-600 italic font-medium mb-8 pb-6 border-b">${post.shortDesc}</p>

                <img src="${post.imageUrl}" alt="${post.title}" class="w-full h-[400px] object-cover rounded-2xl shadow-md mb-10">

                <div class="prose max-w-none text-gray-800 space-y-6 text-lg leading-relaxed">
                    ${post.longDesc}
                </div>

                <div class="mt-12 pt-6 border-t flex flex-wrap gap-2 items-center text-sm text-gray-500">
                    <span class="font-bold text-gray-700">Tags:</span> 
                    <span>${post.tags || 'Food, Trending, USA'}</span>
                </div>
            `;
        } else {
            container.innerHTML = `
                <div class="text-center py-16">
                    <h2 class="text-2xl font-bold text-gray-800 mb-4">Post Not Found</h2>
                    <p class="text-gray-600 mb-6">The blog post you are looking for does not exist or has been removed.</p>
                    <a href="index.html" class="bg-red-600 text-white px-6 py-3 rounded-xl font-bold hover:bg-red-700 transition">Return to Home</a>
                </div>
            `;
        }
    </script>
</body>
</html>
